info:
  name: 01 - List books
  type: http
  seq: 1

http:
  method: GET
  url: http://127.0.0.1:4010/books?page=1&pageSize=20
  headers:
    - name: Authorization
      value: Bearer test-token
  params:
    - name: page
      value: "1"
      type: query
    - name: pageSize
      value: "20"
      type: query
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
