info:
  name: 04 - Borrow book 999
  type: http
  seq: 5

http:
  method: POST
  url: http://127.0.0.1:4010/books/999/borrow-requests
  headers:
    - name: Authorization
      value: Bearer test-token
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
