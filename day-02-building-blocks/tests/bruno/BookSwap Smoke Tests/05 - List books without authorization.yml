info:
  name: " 05 - List books without authorization"
  type: http
  seq: 6

http:
  method: GET
  url: http://127.0.0.1:4010/books?page=1&pageSize=20
  params:
    - name: page
      value: "1"
      type: query
    - name: pageSize
      value: "20"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
